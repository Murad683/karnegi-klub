<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prototip X — Səma</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Manrope:wght@500;700;800&display=swap&subset=latin-ext" rel="stylesheet">
<style>
:root{--sky:#0099FF;--ink:#0B1B33;--orange:#F42902;--lime:#C6FF1A;--white:#FDFDFE}
*{box-sizing:border-box;margin:0}
body{font-family:Manrope,sans-serif;color:var(--ink);background:var(--white);overflow-x:hidden}
.hero{position:relative;min-height:100vh;background:linear-gradient(180deg,#0099FF 0%,#35AEFF 38%,#B9E1FF 62%,var(--white) 82%);padding:0 3vw 5vh}
nav{display:flex;align-items:center;justify-content:space-between;padding:22px 0;color:#fff}
.logo{font-family:Archivo;font-stretch:70%;font-weight:900;font-size:30px;letter-spacing:.5px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.logo i{width:26px;height:26px;border-radius:50%;background:conic-gradient(#E4402F 0 25%,#F6B800 0 50%,#8DB92E 0 75%,#fff 0);mask:radial-gradient(circle,transparent 7px,#000 8px);-webkit-mask:radial-gradient(circle,transparent 7px,#000 8px)}
nav ul{display:flex;gap:26px;list-style:none;font-family:Archivo;font-weight:700;font-size:13px;letter-spacing:.3px;text-transform:uppercase}
nav ul li::before{content:"("}nav ul li::after{content:")"}
.pill{background:#fff;color:var(--ink);padding:14px 22px;border-radius:10px;font-family:Archivo;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.3px;border:0}
h1{font-family:Archivo;font-stretch:68%;font-weight:900;text-transform:uppercase;color:#fff;text-align:center;line-height:.9;font-size:clamp(70px,12.4vw,190px);margin-top:3vh;letter-spacing:-1px}
.sub{text-align:center;color:#fff;font-weight:500;font-size:18px;line-height:1.5;max-width:420px;margin:3vh auto 0}
.cta{display:flex;justify-content:center;margin-top:3.4vh;position:relative}
.btn{background:var(--orange);color:#fff;font-family:Archivo;font-weight:800;text-transform:uppercase;font-size:14px;letter-spacing:.4px;padding:20px 40px;border-radius:12px;border:0;box-shadow:0 14px 30px -12px #F4290299}
.sticker{position:absolute;right:calc(50% - 480px);top:-70px;width:132px;height:132px}
.sticker svg{width:100%;height:100%;animation:spin 14s linear infinite}
.sticker .arrow{position:absolute;inset:0;display:grid;place-items:center}
@keyframes spin{to{transform:rotate(360deg)}}
.shapes{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:2vw;margin-top:7vh;align-items:end}
.shapes div{background-size:cover;background-position:center;height:34vh;min-height:230px;border-radius:14px}
.shapes .o{border-radius:999px}
.shapes .t{height:38vh}
.note{position:fixed;bottom:12px;right:12px;background:var(--ink);color:#fff;font-size:12px;padding:8px 12px;border-radius:10px;opacity:.85}
@media(max-width:800px){nav ul{display:none}.sticker{right:6%;top:-120px;width:104px;height:104px}.shapes{grid-template-columns:1fr 1fr}.shapes div:nth-child(n+3){display:none}}
</style>
</head>
<body>
<section class="hero">
 <nav><div class="logo"><i></i>Karnegi</div>
  <ul><li>Təlimlər</li><li>Haqqımızda</li><li>Qalereya</li><li>Əlaqə</li></ul>
  <button class="pill">İlk dərs pulsuz</button></nav>
 <h1>Burada hamı<br>səsini tapır.</h1>
 <p class="sub">16 ildir minlərlə insana öz səsini tapmağı öyrədirik.</p>
 <div class="cta"><button class="btn">İlk dərsə yazıl</button>
  <div class="sticker">
   <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="58" fill="#C6FF1A"/>
    <defs><path id="c" d="M60,60 m-44,0 a44,44 0 1,1 88,0 a44,44 0 1,1 -88,0"/></defs>
    <text font-family="Archivo" font-weight="800" font-size="10.4" letter-spacing="1.1" fill="#0B1B33"><textPath href="#c">İLK DƏRS PULSUZ · İLK DƏRS PULSUZ ·</textPath></text></svg>
   <div class="arrow"><svg viewBox="0 0 40 40" style="width:34px;height:34px;animation:none"><path d="M6 30 L30 10 M14 10 H30 V26" fill="none" stroke="#0B1B33" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  </div>
 </div>
 <div class="shapes">
  <div style="background-image:url(img/natiq.jpg);background-position:35% 20%"></div>
  <div class="o t" style="background-image:url(img/stress.jpg);background-position:50% 30%"></div>
  <div style="background-image:url(img/satis.jpg);background-position:50% 20%"></div>
  <div class="o t" style="background-image:url(img/ideya.jpg);background-position:55% 25%"></div>
 </div>
</section>
<div class="note">Prototip X · Səma (şəkillər nümunədir)</div>
</body>
</html>
