<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prototip Y — Poster</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Manrope:wght@500;700;800&display=swap&subset=latin-ext" rel="stylesheet">
<style>
:root{--red:#F42902;--lime:#C6FF1A;--white:#FDFDFE;--ink:#0B1B33}
*{box-sizing:border-box;margin:0}
body{font-family:Manrope,sans-serif;background:var(--white);overflow-x:hidden}
.hero{position:relative;min-height:100vh;margin:14px;border-radius:26px;background:var(--red);overflow:hidden;color:#fff;
 background-image:linear-gradient(#ffffff22 1px,transparent 1px),linear-gradient(90deg,#ffffff22 1px,transparent 1px);background-size:56px 56px;background-color:var(--red)}
nav{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:22px 28px}
.logo{font-family:Archivo;font-stretch:70%;font-weight:900;font-size:28px;text-transform:uppercase;border:2px solid #fff;border-radius:999px;padding:4px 18px;background:var(--lime);color:var(--ink)}
nav ul{display:flex;gap:10px;list-style:none}
nav li,.out{border:1.5px solid #ffffffcc;border-radius:999px;padding:9px 18px;font-weight:700;font-size:14px}
.out{background:transparent;color:#fff}
.title{position:relative;z-index:2;text-align:center;font-family:Archivo;font-stretch:125%;font-weight:900;text-transform:uppercase;line-height:.84;letter-spacing:-.04em;font-size:clamp(70px,13.4vw,210px);margin-top:3vh}
.title span{display:block}
.card{position:absolute;z-index:4;width:220px;border-radius:26px;padding:16px;text-align:center;background:#ffffff33;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 40px -20px #0006;font-weight:800}
.card .av{width:78px;height:78px;border-radius:50%;margin:0 auto 10px;background-size:cover;border:3px solid #fff}
.card small{display:block;font-weight:600;opacity:.9;margin-top:2px}
.c1{left:66%;top:44%;transform:rotate(8deg)}
.c2{left:20%;top:56%;transform:rotate(-7deg)}
.arrow{position:absolute;z-index:3}
.a1{left:73%;top:30%;width:140px}.a2{left:11%;top:70%;width:170px}
.sticker{position:absolute;z-index:5;right:5%;bottom:9%;width:170px;height:170px}
.sticker svg.rot{width:100%;height:100%;animation:spin 14s linear infinite}
.sticker .in{position:absolute;inset:0;display:grid;place-items:center}
@keyframes spin{to{transform:rotate(360deg)}}
.cta{position:absolute;z-index:6;left:50%;transform:translateX(-50%);bottom:8%;background:#fff;color:var(--red);font-family:Archivo;font-weight:800;text-transform:uppercase;border:0;padding:20px 44px;border-radius:14px;font-size:15px;box-shadow:0 16px 30px -12px #0006}
.note{position:fixed;bottom:12px;right:12px;background:var(--ink);color:#fff;font-size:12px;padding:8px 12px;border-radius:10px;opacity:.85;z-index:9}
@media(max-width:800px){nav ul{display:none}.card{width:150px;padding:10px}.card .av{width:54px;height:54px}.c1{left:52%}.c2{left:6%;top:62%}.arrow{display:none}.sticker{width:110px;height:110px;right:3%;bottom:16%}}
</style>
</head>
<body>
<section class="hero">
 <nav><div class="logo">Karnegi</div>
  <ul><li>Təlimlər</li><li>Haqqımızda</li><li>Qalereya</li><li>Əlaqə</li></ul>
  <button class="out">İlk dərs pulsuz</button></nav>
 <h1 class="title"><span>Səsini</span><span>tap.</span></h1>

 <svg class="arrow a1" viewBox="0 0 160 120"><path d="M8 14 C70 -6 140 20 120 82 M96 70 L120 86 L136 58" fill="none" stroke="#C6FF1A" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></svg>
 <svg class="arrow a2" viewBox="0 0 180 110"><path d="M10 96 C20 20 90 10 90 56 C90 90 40 80 70 40 C100 4 150 30 160 60 M140 40 L162 62 L138 78" fill="none" stroke="#C6FF1A" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></svg>

 <div class="card c1"><div class="av" style="background-image:url(img/natiq.jpg);background-position:40% 15%"></div>Xarizmatik Natiq<small>nümunə · qrup 106</small></div>
 <div class="card c2"><div class="av" style="background-image:url(img/stress.jpg);background-position:50% 25%"></div>Stress Management<small>nümunə · qrup 98</small></div>

 <div class="sticker">
  <svg class="rot" viewBox="0 0 120 120"><circle cx="60" cy="60" r="58" fill="#C6FF1A"/>
   <defs><path id="c" d="M60,60 m-44,0 a44,44 0 1,1 88,0 a44,44 0 1,1 -88,0"/></defs>
   <text font-family="Archivo" font-weight="800" font-size="10.4" letter-spacing="1.1" fill="#0B1B33"><textPath href="#c">İLK DƏRS PULSUZ · İLK DƏRS PULSUZ ·</textPath></text></svg>
  <div class="in"><svg viewBox="0 0 40 40" width="44" height="44"><path d="M6 30 L30 10 M14 10 H30 V26" fill="none" stroke="#0B1B33" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
 </div>
 <button class="cta">İlk dərsə yazıl</button>
</section>
<div class="note">Prototip Y · Poster (şəkillər nümunədir)</div>
</body>
</html>
