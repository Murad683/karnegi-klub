<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prototip C — 106 qrup divarı</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap&subset=latin-ext" rel="stylesheet">
<style>
:root{--cream:#FFF6E8;--ink:#1F2433;--red:#E4402F;--blue:#1E88D8;--green:#8DB92E;--yellow:#F6B800}
*{box-sizing:border-box;margin:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--cream);color:var(--ink);overflow-x:hidden}
.hero{position:relative;min-height:100vh;display:grid;place-items:center;padding:30px 5vw;overflow:hidden}
.wall{position:absolute;inset:-4%;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));grid-auto-rows:130px;gap:10px;transform:rotate(-4deg) scale(1.08)}
.t{border-radius:16px;background-size:cover;background-position:center;opacity:.9;transition:transform .4s,opacity .4s;position:relative}
.t:hover{transform:scale(1.12) rotate(2deg);opacity:1;z-index:2}
.t.k{opacity:1;display:grid;place-items:center;color:#fff;font-family:Fraunces,serif;font-weight:800;font-size:22px}
.veil{position:absolute;inset:0;background:radial-gradient(ellipse at center,var(--cream) 22%,#FFF6E8cc 48%,#FFF6E855 80%);pointer-events:none}
.center{position:relative;z-index:2;text-align:center;max-width:760px}
.logo{font-family:Fraunces,serif;font-weight:800;font-size:22px;display:inline-flex;align-items:center;gap:10px;margin-bottom:26px}
.ring{width:30px;height:30px;border-radius:50%;background:conic-gradient(var(--red) 0 25%,var(--yellow) 0 50%,var(--green) 0 75%,var(--blue) 0);mask:radial-gradient(circle,transparent 8px,#000 9px);-webkit-mask:radial-gradient(circle,transparent 8px,#000 9px)}
.live{display:inline-flex;align-items:center;gap:10px;background:#fff;padding:9px 18px;border-radius:99px;font-weight:700;font-size:14px;box-shadow:0 6px 20px #0002}
.live i{width:10px;height:10px;border-radius:50%;background:var(--red);animation:p 1.4s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 #E4402F88}100%{box-shadow:0 0 0 12px #E4402F00}}
h1{font-family:Fraunces,serif;font-weight:800;font-size:clamp(40px,6vw,84px);line-height:1;letter-spacing:-2px;margin:22px 0 18px}
h1 em{font-style:normal;color:var(--blue)}
p.lead{font-size:19px;line-height:1.6;color:#4a5064;max-width:560px;margin:0 auto 30px}
.btn{background:var(--red);color:#fff;padding:15px 28px;border-radius:99px;font-weight:700;text-decoration:none;display:inline-block;box-shadow:0 8px 24px -8px var(--red)}
.stats{display:flex;gap:clamp(18px,4vw,56px);justify-content:center;margin-top:40px;flex-wrap:wrap}
.stats div{font-weight:600;font-size:14px;color:#5b6176}
.stats b{display:block;font-family:Fraunces,serif;font-size:clamp(34px,4.4vw,52px);color:var(--ink);line-height:1}
.note{position:fixed;bottom:12px;right:12px;background:var(--ink);color:#fff;font-size:12px;padding:8px 12px;border-radius:10px;opacity:.85;z-index:9}
</style>
</head>
<body>
<section class="hero">
 <div class="wall" id="wall"></div><div class="veil"></div>
 <div class="center">
  <div class="logo"><span class="ring"></span>Karnegi Klub</div><br>
  <span class="live"><i></i>Bu axşam 54 nəfər dərsdədir</span>
  <h1>Burada <em>hamı</em> səsini tapır.</h1>
  <p class="lead">106 qrup, minlərlə hekayə. Sıradakı hekayə sizin ola bilər.</p>
  <a class="btn" href="#">Pulsuz ilk dərsə yazıl</a>
  <div class="stats"><div><b data-n="16">0</b>il təcrübə</div><div><b data-n="106">0</b>qrup</div><div><b data-n="5000" data-plus>0</b>məzun</div></div>
 </div>
</section>
<div class="note">Prototip C · 106 qrup divarı (şəkillər, rəqəmlər nümunədir)</div>
<script>
const imgs=['natiq','beyin','time','satis','stress','ideya'],cols=['#E4402F','#1E88D8','#8DB92E','#F6B800'],w=document.getElementById('wall');
for(let i=0;i<110;i++){const d=document.createElement('div');d.className='t';
 if(i%7===3){d.classList.add('k');d.style.background=cols[i%4];d.textContent=(i%106)+1+'-ci qrup'}
 else{d.style.backgroundImage=`url(img/${imgs[(i*5)%6]}.jpg)`;d.style.backgroundPosition=['50% 15%','35% 20%','65% 25%'][i%3]}
 w.appendChild(d)}
document.querySelectorAll('[data-n]').forEach(el=>{const n=+el.dataset.n;let c=0;const s=n/70;
 const t=setInterval(()=>{c=Math.min(n,c+s);el.textContent=Math.round(c).toLocaleString('az')+(c>=n&&el.hasAttribute('data-plus')?'+':'');if(c>=n)clearInterval(t)},25)});
</script>
</body>
</html>
